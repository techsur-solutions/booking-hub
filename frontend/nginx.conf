# The public host and scheme the browser used. Behind Pivota's preview (or any proxy) these
# arrive as X-Forwarded-*; when the browser hits nginx directly they are this request's own.
map $http_x_forwarded_host $public_host {
    ""      $http_host;
    default $http_x_forwarded_host;
}
map $http_x_forwarded_proto $public_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Keycloak on this same origin (see frontend/src/auth/keycloak.ts). `^~` keeps the static-asset
    # regex below from catching Keycloak's own .js/.css. Keycloak builds its URLs from the
    # forwarded host/proto (KC_PROXY_HEADERS=xforwarded), so tokens and login-page links carry
    # the public address.
    location ^~ /realms/    { include /etc/nginx/conf.d/keycloak-proxy.inc; }
    location ^~ /resources/ { include /etc/nginx/conf.d/keycloak-proxy.inc; }
    location ^~ /js/        { include /etc/nginx/conf.d/keycloak-proxy.inc; }

    # SPA client-side routing support
    location / {
        try_files $uri /index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
