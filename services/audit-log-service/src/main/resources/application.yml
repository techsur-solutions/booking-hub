server:
  port: 8088

spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audit_db}
    username: ${DB_USER:audit_svc}
    password: ${DB_PASSWORD:audit_svc_pw}
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${FLYWAY_DB_HOST:${DB_HOST:localhost}}:${FLYWAY_DB_PORT:${DB_PORT:5432}}/${FLYWAY_DB_NAME:${DB_NAME:audit_db}}
    user: ${FLYWAY_DB_USER:audit_migrator}
    password: ${FLYWAY_DB_PASSWORD:audit_migrator_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Disabled until Phase 3: RabbitMQ listener beans will be implemented in Phase 3
        # when event-driven message processing is added. Enabling without listener beans
        # will cause startup failure with "No bean of type RabbitListenerContainerFactory"
        auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
