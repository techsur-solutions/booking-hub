# Test configuration using the running Postgres from docker-compose.
#
# Testcontainers cannot be used in this sandbox: the Docker daemon reports client
# API version 1.32, below Testcontainers' minimum of 1.40. Same pre-existing
# incompatibility and same workaround as Phase 4 plan 04-01 and Phase 6 plan 06-03.
spring.datasource.url=jdbc:postgresql://localhost:5432/feeds_db_test
spring.datasource.username=postgres
spring.datasource.password=postgres_root_pw
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# No live RabbitMQ broker needed for repository/context tests.
spring.rabbitmq.listener.simple.auto-startup=false

# Reduce connection pool size to prevent "too many clients" with multiple test contexts.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
