server:
  port: 8086

spring:
  application:
    name: feeds-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:feeds_db}
    username: ${DB_USER:feeds_svc}
    password: ${DB_PASSWORD:feeds_svc_pw}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Enabled in Phase 7 (plan 07-01): the rabbitListenerContainerFactory bean now
        # exists (RabbitConfig) and plan 07-02 adds the @RabbitListener consumer beans,
        # so the Phase-2 boot-safety placeholder is no longer needed.
        auto-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
