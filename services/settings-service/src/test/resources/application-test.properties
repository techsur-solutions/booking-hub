# Test configuration using the running Postgres from docker-compose
# (Testcontainers Docker API version incompatibility in this sandbox — see
# Phase 3 plan 03-01's identical workaround, also applied in this phase's
# 04-01/04-03 plans for locations-resources-service/custom-field-service.)
spring.datasource.url=jdbc:postgresql://localhost:5432/settings_db_test
spring.datasource.username=settings_svc
spring.datasource.password=settings_svc_pw
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Reduce connection pool size to prevent "too many clients" with multiple test contexts
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
