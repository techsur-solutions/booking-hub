server:
  port: 8087

spring:
  application:
    name: settings-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:settings_db}
    username: ${DB_USER:settings_svc}
    password: ${DB_PASSWORD:settings_svc_pw}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}/realms/${KEYCLOAK_REALM:bookinghub}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # settings-service is a pure outbox publisher — it has no @RabbitListener beans
        # and never will. Keep auto-startup: false permanently to suppress the idle
        # SimpleMessageListenerContainer Spring Boot would otherwise start.
        auto-startup: false

outbox:
  poll-interval-ms: 2000
  batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
