server:
  port: 8084

spring:
  application:
    name: users-permissions-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userperm_db}
    username: ${DB_USER:userperm_svc}
    password: ${DB_PASSWORD:userperm_svc_pw}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}/realms/${KEYCLOAK_REALM:bookinghub}

keycloak:
  realm: ${KEYCLOAK_REALM:bookinghub}
  server-url: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}
  admin-client-id: userperm-admin-client
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  direct-grant-client-id: userperm-direct-grant-client
  direct-grant-client-secret: ${KEYCLOAK_DIRECT_GRANT_CLIENT_SECRET:}
  direct-grant-remember-client-id: userperm-direct-grant-remember-client
  direct-grant-remember-client-secret: ${KEYCLOAK_DIRECT_GRANT_REMEMBER_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
