server:
  port: 0

spring:
  application:
    name: api-gateway-test
  cloud:
    gateway:
      routes:
        - id: bookings
          uri: http://nonexistent-booking-service:8081
          predicates:
            - Path=/bookings/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingCB
                fallbackUri: forward:/fallback
        - id: locations-resources
          uri: http://nonexistent-locations-service:8082
          predicates:
            - Path=/locations/**,/resources/**
        - id: custom-fields
          uri: http://nonexistent-custom-field-service:8083
          predicates:
            - Path=/custom-fields/**,/field-templates/**
        - id: auth-users
          uri: http://nonexistent-users-service:8084
          predicates:
            - Path=/auth/**,/users/**,/permissions/**,/roles/**
        - id: notifications
          uri: http://nonexistent-notifications-service:8085
          predicates:
            - Path=/notifications/**
        - id: feeds
          uri: http://nonexistent-feeds-service:8086
          predicates:
            - Path=/feeds/**
        - id: settings
          uri: http://nonexistent-settings-service:8087
          predicates:
            - Path=/settings/**
        - id: audit-log
          uri: http://nonexistent-audit-service:8088
          predicates:
            - Path=/audit-log/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # Will be overridden in fail-closed test with unreachable URI
          issuer-uri: http://localhost:8180/realms/bookinghub

management:
  endpoints:
    web:
      exposure:
        include: health,info
