# Test configuration using the running Postgres from docker-compose
# (Testcontainers Docker API version incompatibility in this sandbox — client version 1.32
# is too old, minimum supported API version is 1.40. Same workaround as Phase 4 plan 04-01's
# SchemaCompletionTest for locations-resources-service and Phase 3 plan 03-01's
# PermissionSeedDataTest / OutboxAndResetTokenRepositoryTest for users-permissions-service.)
spring.datasource.url=jdbc:postgresql://postgres:5432/notif_db_test
spring.datasource.username=postgres
spring.datasource.password=postgres_root_pw
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.url=jdbc:postgresql://postgres:5432/notif_db_test
spring.flyway.user=postgres
spring.flyway.password=postgres_root_pw

# Reduce connection pool size to prevent "too many clients" with multiple test contexts
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# RabbitMQ: use the running docker-compose broker
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Disable RabbitMQ listener auto-startup in tests (no listeners defined in this plan)
spring.rabbitmq.listener.simple.auto-startup=false

# Mail: minimal config for test context (no real SMTP in tests)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
