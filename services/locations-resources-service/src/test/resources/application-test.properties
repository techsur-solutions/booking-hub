# Test configuration using the running Postgres from docker-compose
# (Testcontainers Docker API version incompatibility in this sandbox — see
# Phase 3 plan 03-01's identical workaround for users-permissions-service.)
spring.datasource.url=jdbc:postgresql://localhost:5432/locres_db_test
spring.datasource.username=postgres
spring.datasource.password=postgres_root_pw
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Reduce connection pool size to prevent "too many clients" with multiple test contexts
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
