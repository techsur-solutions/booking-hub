services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: locres_svc
      POSTGRES_PASSWORD: locres_svc_pw
      POSTGRES_DB: locres_db
    volumes:
      - locres_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locres_svc"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5433:5432"

  app:
    build: .
    ports:
      - "8082:8082"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: locres_db
      DB_USER: locres_svc
      DB_PASSWORD: locres_svc_pw
    depends_on:
      db:
        condition: service_healthy

volumes:
  locres_db_data:
