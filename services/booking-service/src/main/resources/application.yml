server:
  port: 8081

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}
    username: ${DB_USER:booking_svc}
    password: ${DB_PASSWORD:booking_svc_pw}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}/realms/${KEYCLOAK_REALM:bookinghub}

outbox:
  poll-interval-ms: 2000
  batch-size: 100

downstream:
  locations-resources-service:
    base-url: http://${LOCATIONS_RESOURCES_SERVICE_HOST:locations-resources-service}:${LOCATIONS_RESOURCES_SERVICE_PORT:8082}
  custom-field-service:
    base-url: http://${CUSTOM_FIELD_SERVICE_HOST:custom-field-service}:${CUSTOM_FIELD_SERVICE_PORT:8083}
  settings-service:
    base-url: http://${SETTINGS_SERVICE_HOST:settings-service}:${SETTINGS_SERVICE_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
