# Test configuration using the running Postgres from docker-compose
# (Testcontainers Docker API version incompatibility in this sandbox — see
# Phase 3 plan 03-01's identical workaround for users-permissions-service and
# Phase 4 plan 04-01's workaround for locations-resources-service.)
spring.datasource.url=jdbc:postgresql://localhost:5432/booking_db_test
spring.datasource.username=postgres
spring.datasource.password=postgres_root_pw
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Reduce connection pool size to prevent "too many clients" with multiple test contexts
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# RabbitMQ: same sandbox Docker-API-version workaround as Postgres above - uses
# the real running docker-compose RabbitMQ broker (localhost:5672) instead of
# Testcontainers' RabbitMQContainer.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

# Slow the outbox poller down during tests so test-created rows are not
# raced/relayed by the scheduled bean before a test's own explicit
# relayPendingEvents() invocation can observe them deterministically.
outbox.poll-interval-ms=600000

# Security: use a dummy/unreachable issuer for tests that mock their own context
# (Tier2FailClosedTest uses WireMock to override this per-test-class via @DynamicPropertySource)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/bookinghub
