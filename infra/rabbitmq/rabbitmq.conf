# RabbitMQ Configuration for BookingHub
# Local development environment only

# Enable management plugin and load definitions from mounted JSON file
management.load_definitions = /etc/rabbitmq/definitions.json

# Relax loopback_users restriction for local dev
# This allows guest:guest authentication over Docker port-forwarded connections (15672:15672)
# from the host (which RabbitMQ sees as arriving from the Docker bridge, not 127.0.0.1).
# Required for plan 02-12's host-side management-API verification curl calls.
# SECURITY WARNING: This is a LOCAL-DEV-ONLY convenience. Never use in staging/production.
# Before any non-local deployment: replace guest with a dedicated non-guest administrator credential.
loopback_users.guest = false
