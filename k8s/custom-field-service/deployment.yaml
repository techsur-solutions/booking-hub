apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-field-service
  namespace: bookinghub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: custom-field-service
  template:
    metadata:
      labels:
        app: custom-field-service
    spec:
      containers:
        - name: custom-field-service
          image: bookinghub/custom-field-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: custom-field-service-config
            - secretRef:
                name: custom-field-service-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
