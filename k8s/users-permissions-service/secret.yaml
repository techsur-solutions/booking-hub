apiVersion: v1
kind: Secret
metadata:
  name: users-permissions-service-secret
  namespace: bookinghub
type: Opaque
data:
  # Base64 encoded placeholder values
  # DB_USER: userperm_svc (base64: dXNlcnBlcm1fc3Zj)
  DB_USER: dXNlcnBlcm1fc3Zj
  # DB_PASSWORD: userperm_svc_pw (base64: dXNlcnBlcm1fc3ZjX3B3)
  DB_PASSWORD: dXNlcnBlcm1fc3ZjX3B3
  # KEYCLOAK_ADMIN_CLIENT_SECRET: placeholder (base64: cGxhY2Vob2xkZXI=)
  KEYCLOAK_ADMIN_CLIENT_SECRET: cGxhY2Vob2xkZXI=
  # KEYCLOAK_DIRECT_GRANT_CLIENT_SECRET: placeholder (base64: cGxhY2Vob2xkZXI=)
  # For userperm-direct-grant-client (standard session)
  KEYCLOAK_DIRECT_GRANT_CLIENT_SECRET: cGxhY2Vob2xkZXI=
  # KEYCLOAK_DIRECT_GRANT_REMEMBER_CLIENT_SECRET: placeholder (base64: cGxhY2Vob2xkZXI=)
  # For userperm-direct-grant-remember-client (30-day session)
  KEYCLOAK_DIRECT_GRANT_REMEMBER_CLIENT_SECRET: cGxhY2Vob2xkZXI=
