apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-permissions-service
  namespace: bookinghub
  labels:
    app: users-permissions-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-permissions-service
  template:
    metadata:
      labels:
        app: users-permissions-service
    spec:
      containers:
      - name: users-permissions-service
        image: bookinghub/users-permissions-service:latest
        ports:
        - containerPort: 8084
          protocol: TCP
        envFrom:
        - configMapRef:
            name: users-permissions-service-config
        - secretRef:
            name: users-permissions-service-secret
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
