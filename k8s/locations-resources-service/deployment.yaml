apiVersion: apps/v1
kind: Deployment
metadata:
  name: locations-resources-service
  namespace: bookinghub
  labels:
    app: locations-resources-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: locations-resources-service
  template:
    metadata:
      labels:
        app: locations-resources-service
    spec:
      containers:
      - name: locations-resources-service
        image: bookinghub/locations-resources-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          protocol: TCP
        envFrom:
        - configMapRef:
            name: locations-resources-service-config
        - secretRef:
            name: locations-resources-service-secret
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
