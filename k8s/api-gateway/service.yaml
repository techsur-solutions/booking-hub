apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bookinghub
  labels:
    app: api-gateway
spec:
  type: LoadBalancer  # EXTERNAL ACCESS - Gateway exception per TechArch §5.4
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: bookinghub
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.bookinghub.example.com
      secretName: api-gateway-tls
  rules:
    - host: api.bookinghub.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
