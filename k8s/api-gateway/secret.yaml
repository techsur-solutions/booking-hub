apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: bookinghub
type: Opaque
data:
  # TLS cert/key references - termination handled at Gateway per TechArch §5.3
  # Note: TLS termination configuration per cluster setup
  # Actual secrets should be managed via sealed-secrets or external secret manager
  TLS_CERT: ""  # placeholder - actual certificate in base64
  TLS_KEY: ""   # placeholder - actual key in base64
