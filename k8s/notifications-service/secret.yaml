apiVersion: v1
kind: Secret
metadata:
  name: notifications-service-secret
  labels:
    app: notifications-service
type: Opaque
data:
  # NOTE: These are placeholder dummy values for local development only.
  # Real deployments MUST inject actual secrets via the cluster's secret manager.
  # NEVER commit real credentials to source control.
  DB_USER: bm90aWZfc3Zj                      # notif_svc (base64)
  DB_PASSWORD: bm90aWZfc3ZjX3B3              # notif_svc_pw (base64)
  RABBITMQ_USERNAME: Z3Vlc3Q=                # guest (base64)
  RABBITMQ_PASSWORD: Z3Vlc3Q=                # guest (base64)
  # SMTP_CREDENTIALS is superseded by the two distinct keys below (SMTP_USERNAME, SMTP_PASSWORD).
  # Left in place to avoid breaking anything that might still reference this Secret's key set.
  SMTP_CREDENTIALS: c210cF9wbGFjZWhvbGRlcg==  # smtp_placeholder (base64)
  SMTP_USERNAME: c210cF91c2VybmFtZV9wbGFjZWhvbGRlcg==  # smtp_username_placeholder (base64)
  SMTP_PASSWORD: c210cF9wYXNzd29yZF9wbGFjZWhvbGRlcg==  # smtp_password_placeholder (base64)
